[workspace]
resolver = "2"
members = ["core"]

[workspace.package]
edition = "2021"
rust-version = "1.78"
license = "AGPL-3.0-or-later"
authors = ["Ankur Sinha <h99311@gmail.com>"]
repository = "https://github.com/unhosted-ai/unhosted-payments"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
thiserror = "1"
